# AI RC Car – global parameters
# Adjust to match your hardware wiring and setup.

vehicle_node:
  ros__parameters:
    esc_pin:           12       # GPIO pin for ESC PWM (BCM numbering on RPi)
    servo_pin:         13       # GPIO pin for servo PWM
    max_linear_speed:  0.3      # m/s – start conservative, increase when confident
    max_angular_speed: 1.0      # rad/s
    servo_trim_us:     0        # Trim ±50 µs if car doesn't drive straight
    watchdog_timeout:  0.5      # seconds without cmd → stop motors

gps_node:
  ros__parameters:
    port:     '/dev/ttyUSB0'    # GPS serial port (check with: ls /dev/ttyUSB*)
    baudrate: 9600
    frame_id: 'gps_link'

imu_node:
  ros__parameters:
    i2c_bus:  1
    i2c_addr: 0x68              # 0x68 (AD0 low) or 0x69 (AD0 high)
    frame_id: 'imu_link'
    rate_hz:  100.0

ultrasonic_node:
  ros__parameters:
    # Physical pin numbers (BOARD numbering)
    trig_front: 11
    echo_front: 13
    trig_rear:  15
    echo_rear:  16
    trig_left:  18
    echo_left:  22
    trig_right: 29
    echo_right: 31

receiver_node:
  ros__parameters:
    port:              '/dev/ttyAMA0'   # RPi5 UART0 = GPIO 14/15, physical pin 8/10
    baudrate:          115200
    deadzone:          0.05             # 5% stick deadzone (eliminates drift)
    max_linear_speed:  0.5              # m/s at full throttle (match vehicle_node)
    max_angular_speed: 1.0             # rad/s at full steer

    # Channel mapping (0-based, FS-GT5 defaults):
    # CH1 (idx 0) = steering wheel
    # CH2 (idx 1) = throttle trigger
    # CH5 (idx 4) = SWA kill switch  → flip DOWN = STOP
    # CH6 (idx 5) = SWB mode switch  → 3 positions = manual/follow_me/autonomous

mission_node:
  ros__parameters: {}

oak_node:
  ros__parameters:
    model_name:        'yolov8n_coco_640x352'   # YOLOv8n, op Myriad X chip
    shaves:            6                         # Aantal Myriad X shaves (max 6 op OAK-D Lite)
    confidence:        0.45                      # Minimum detectie confidence
    frame_id:          'oak_rgb_camera_optical_frame'
    publish_annotated: true                      # Debug overlay topic

tracking_node:
  ros__parameters:
    gain_angular:    1.8     # P-gain stuurcorrectie (hoger = scherper sturen)
    gain_linear:     0.0004  # P-gain afstandsregeling (hoger = sneller reageren)
    target_dist_mm:  1500.0  # Gewenste volgafstand (1.5 m)
    max_linear:      0.4     # Maximale rijsnelheid bij volgen (m/s)
    max_angular:     1.2     # Maximale draaisnelheid (rad/s)
    lost_timeout:    1.5     # Stop na X seconden geen persoon gezien

depth_node:
  ros__parameters:
    stop_dist_mm:  800.0     # Afstand (mm) waaronder rijstrook geblokkeerd
    warn_dist_mm:  1500.0    # Afstand (mm) waaronder waarschuwing
    publish_rate:  10.0      # Hz

avoidance_node:
  ros__parameters:
    stop_dist_mm:   800.0   # Afstand (mm) GEBLOKKEERD  – moet overeenkomen met depth_node
    warn_dist_mm:   1500.0  # Afstand (mm) WAARSCHUWING – moet overeenkomen met depth_node
    max_linear:     0.4     # Maximale rijsnelheid (m/s) bij vrij pad
    max_angular:    1.2     # Maximale draaisnelheid (rad/s) bij uitwijken
    sensor_timeout: 0.8     # Maximale leeftijd van sensordata (s)
    publish_rate:   20.0    # Hz

navigation_node:
  ros__parameters:
    lookahead_m:          2.5    # Pure pursuit blik-vooruit afstand (m)
    max_linear:           0.5    # Maximale rijsnelheid (m/s)
    min_linear:           0.1    # Minimale rijsnelheid bij nadering waypoint (m/s)
    max_angular:          1.2    # Maximale draaisnelheid (rad/s)
    slow_radius_m:        3.0    # Start remmen op X meter van waypoint
    target_radius_m:      1.5    # Aankomstradius (m) – standaard per waypoint
    gps_timeout_s:        2.0    # Stop navigatie na X s GPS-verlies
    imu_alpha:            0.95   # IMU gewicht heading filter (0=GPS, 1=IMU)
    min_speed_gps:        0.4    # Minimale GPS-snelheid voor koers-update (m/s)
    set_origin_on_start:  true   # Gebruik eerste GPS-fix als nulpunt
    publish_rate:         20.0   # Hz
